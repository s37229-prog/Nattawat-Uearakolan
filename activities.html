<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานและกิจกรรม - TCAS Portfolio - ณัฐวรรธน์ เอื้อรักษ์โอฬาร</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Sarabun', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f3042 0%, #061520 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .portfolio-container {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* --- ส่วนปก / Header --- */
        .top-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.4);
            padding: 8px 32px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #e0f7fa;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
        }

        .main-hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        .circle-frame {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid #8fe3ff;
            box-shadow: 0 0 20px rgba(143, 227, 255, 0.4), inset 0 0 12px rgba(143, 227, 255, 0.3);
            overflow: hidden;
            flex-shrink: 0;
            background: #0d2838;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .center-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.35);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
        }

        .card-text-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-text-side h1 {
            font-size: 34px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .card-text-side h2 {
            font-size: 22px;
            font-weight: 400;
            color: #d1ecf1;
            line-height: 1.45;
        }

        .card-text-side .course {
            font-size: 22px;
            font-weight: 500;
            color: #ffffff;
        }

        .card-text-side .author {
            font-size: 18px;
            color: #a0c4d6;
            margin-top: 6px;
        }

        .card-image-side {
            flex: 0.9;
            display: flex;
            justify-content: center;
        }

        .image-square-box {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1 / 1;
            border: 2px solid rgba(0, 229, 255, 0.5);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .image-square-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- เมนูนำทาง --- */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
            margin-top: 10px;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #e0f2fe;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }

        .nav-btn.active, .nav-btn:hover {
            background: rgba(0, 229, 255, 0.18);
            border-color: #00e5ff;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
        }

        .gold-btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #e6c875 0%, #a88038 100%);
            border: none;
            color: #1a1000;
            padding: 12px 48px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.55);
        }

        /* --- เนื้อหาหน้าผลงานและกิจกรรม --- */
        .info-grid {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .info-card {
            background: #ffffff;
            color: #1e293b;
            padding: 40px 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
        }

        .info-card h3 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 24px;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }

        .info-card h3::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 4px;
            background-color: #00bcd4;
            border-radius: 2px;
        }

        .activity-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 10px;
        }

        .gallery-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            padding: 10px;
        }

        .gallery-box:hover {
            border-color: #00bcd4;
            background: #e0f2fe;
            color: #0284c7;
        }

        .gallery-box span {
            font-size: 32px;
            margin-bottom: 6px;
        }

        @media (max-width: 900px) {
            .main-hero { flex-direction: column; }
            .center-card { flex-direction: column; width: 100%; text-align: center; }
            .info-card { padding: 32px 24px; }
            .info-card h3 { font-size: 24px; }
            .activity-gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- Badge ด้านบนสุด -->
        <div class="top-badge">TCAS PORTFOLIO</div>

        <!-- ส่วนปก (Hero Banner) -->
        <div class="main-hero">
            <div class="circle-frame">
                <img src="Mahidol_U.png" alt="Mahidol University Logo">
            </div>

            <div class="center-card">
                <div class="card-text-side">
                    <h1>แฟ้มสะสมงาน (Portfolio)</h1>
                    <h2>คณะแพทยศาสตร์ศิริราชพยาบาล<br>มหาวิทยาลัยมหิดล</h2>
                    <div class="course">หลักสูตรแพทยศาสตรบัณฑิต</div>
                    <div class="author">จัดทำโดย : ณัฐวรรธน์ เอื้อรักษ์โอฬาร</div>
                </div>

                <div class="card-image-side">
                    <div class="image-square-box">
                        <img src="IMG_0619.jpeg" alt="Portfolio Image">
                    </div>
                </div>
            </div>

            <div class="circle-frame">
                <img src="images.jpg" alt="Profile Picture">
            </div>
        </div>

        <!-- แถบเมนูนำทาง -->
        <div class="nav-tabs">
            <a href="portfolio.html" class="nav-btn">PORTFOLIO</a>
            <a href="intro.html" class="nav-btn">คำนำ</a>
            <a href="profile.html" class="nav-btn">ประวัติส่วนตัว</a>
            <a href="activities.html" class="nav-btn active">ผลงานและกิจกรรม</a>
            <a href="contact.html" class="nav-btn">ช่องทางการติดต่อ</a>
        </div>

        <a href="index.html" class="gold-btn">กลับหน้าแรก</a>

        <!-- รายละเอียดผลงานและกิจกรรม -->
        <div class="info-grid">
            <div class="info-card">
                <h3>ผลงานและกิจกรรมที่เข้าร่วม</h3>
                <div class="activity-gallery">
                    <div class="gallery-box">
                        <span>📷</span>
                        <div>ภาพที่ 1</div>
                    </div>
                    <div class="gallery-box">
                        <span>📷</span>
                        <div>ภาพที่ 2</div>
                    </div>
                    <div class="gallery-box">
                        <span>📷</span>
                        <div>ภาพที่ 3</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
