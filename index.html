<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน - Nattawat</title>

<!-- ดึงฟอนต์ Prompt จาก Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Prompt', sans-serif;
}

body {
    background: linear-gradient(135deg, #050d15 0%, #0a1926 50%, #0d2030 100%);
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

/* Badge ด้านบน */
.top-badge {
    background-color: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 229, 255, 0.3);
    color: #ffffff;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 25px;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
}

/* การ์ดหลัก */
.card {
    background: rgba(16, 33, 48, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    max-width: 750px;
    width: 100%;
    padding: 35px 40px;
    display: flex;
    gap: 30px;
    align-items: center;
    backdrop-filter: blur(10px);
}

/* ฝั่งข้อความด้านซ้าย */
.card-content {
    flex: 1;
    text-align: left;
}

.card-content h1 {
    font-size: 24px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 15px;
}

.card-content p {
    font-size: 15px;
    color: #9ab0c1;
    line-height: 1.7;
    margin-bottom: 10px;
    font-weight: 300;
}

.card-content p strong {
    color: #ffffff;
    font-weight: 500;
}

.card-content .highlight {
    color: #00e5ff;
}

/* ช่องใส่รูปภาพด้านขวา */
.photo-box {
    width: 220px;
    height: 220px;
    border: 2px dashed rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #7a94a8;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
    position: relative;
}

.photo-box:hover {
    border-color: #00e5ff;
    color: #00e5ff;
    background: rgba(0, 229, 255, 0.05);
}

.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-box .plus-icon {
    font-size: 24px;
    margin-bottom: 5px;
}

.photo-box span {
    font-size: 13px;
}

/* ปุ่มสีทองด้านล่างสุด */
.action-btn {
    margin-top: 35px;
    background-color: #dfaa5b;
    color: #1a1000;
    padding: 10px 35px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(223, 170, 91, 0.3);
}

.action-btn:hover {
    background-color: #f0be72;
    transform: translateY(-2px);
}

/* รองรับการแสดงผลบนมือถือ */
@media (max-width: 650px) {
    .card {
        flex-direction: column-reverse;
        padding: 25px;
        text-align: center;
    }
    .card-content {
        text-align: center;
    }
    .photo-box {
        width: 180px;
        height: 180px;
    }
}
</style>
</head>
<body>

    <!-- Badge หัวข้อบนสุด -->
    <div class="top-badge">MY PORTFOLIO</div>

    <!-- การ์ดหลัก -->
    <div class="card">
        <!-- ฝั่งข้อมูลรายละเอียด -->
        <div class="card-content">
            <h1>แฟ้มสะสมงาน (Portfolio)</h1>
            <p>สวัสดีครับ! ผมชื่อ <strong>ณัฐวรรธน์ (Nattawat)</strong></p>
            <p>ขณะนี้กำลังศึกษา/สนใจด้าน <span class="highlight">Computer Science & Engineering</span></p>
            <p style="font-size: 13px; margin-top: 15px; color: #6b8296;">
                เว็บไซต์นี้โฮสต์อยู่บน GitHub Pages
            </p>
        </div>

        <!-- ฝั่งใส่รูปภาพปก/รูปโปรไฟล์ -->
        <div class="photo-box">
            <!-- <img src="profile.jpg" alt="รูปโปรไฟล์"> -->
            <div class="plus-icon">+</div>
            <span>Add Photo</span>
        </div>
    </div>

    <!-- ปุ่มลิงก์ดูผลงานสีทอง -->
    <a href="portfolio.html" class="action-btn">👉 ดูแฟ้มสะสมงานของผม</a>

</body>
</html>
